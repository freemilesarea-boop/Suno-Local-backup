name: Source Diagnose (macOS)

# READ-ONLY investigation of how a public Suno song exposes its audio resource.
# Runs on an internet-connected runner (this repo's sandbox cannot reach
# suno.com). No downloads, no artifacts, no code paths changed. Push-triggered
# on the diagnostic files only so it does not run on ordinary commits.
on:
  workflow_dispatch:
    inputs:
      song_url:
        description: 'Public Suno song URL (https://suno.com/song/<uuid>)'
        required: false
        default: ''
  push:
    branches:
      - claude/suno-local-importer-mvp-7bz1iy
    paths:
      - 'scripts/source-diagnose.js'
      - '.github/workflows/source-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: macos-14
    env:
      # Investigation target for this phase: a public song URL provided by the
      # owner. Override via the workflow_dispatch input for other songs.
      SONG_URL: ${{ github.event.inputs.song_url || 'https://suno.com/song/fd6414b2-ad70-485b-9b71-c0dee2c12203' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run source diagnostic (read-only)
        run: node scripts/source-diagnose.js "$SONG_URL"
