name: Source Diagnose

# One-off READ-ONLY diagnostic: runs scripts/source-diagnose.js against a public
# Suno song URL on a runner that can reach suno.com, so we can root-cause a
# "download did not complete" failure. No download/convert, no auth, no bypass.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/suno-local-importer-mvp-7bz1iy
    paths:
      - 'scripts/source-diagnose.js'
      - '.github/workflows/source-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      SONG_URL: https://suno.com/song/0e7a88a8-d4db-4434-ab37-691bf47b8b2b
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (npm ci)
        run: npm ci
      - name: Diagnose source (read-only)
        run: node scripts/source-diagnose.js "$SONG_URL"
