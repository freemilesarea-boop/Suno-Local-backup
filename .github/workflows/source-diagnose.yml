name: Source Diagnose

# READ-ONLY: does the anonymous public page hand out a playable (signed) audio
# URL or embedded stream data? No download/convert, no auth, no bypass; query
# VALUES (tokens/signatures) are never printed.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/suno-local-importer-mvp-7bz1iy
    paths:
      - 'scripts/source-diagnose.js'
      - '.github/workflows/source-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (npm ci)
        run: npm ci
      - name: Diagnose the failing song (read-only)
        run: node scripts/source-diagnose.js "https://suno.com/song/0e7a88a8-d4db-4434-ab37-691bf47b8b2b"
