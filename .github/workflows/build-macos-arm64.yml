name: Build macOS Apple Silicon

# Manual dispatch is the intended trigger. A branch-scoped push trigger is also
# enabled for the release branch so the build can run in environments where API
# workflow_dispatch is not permitted (integration lacking actions:write).
on:
  workflow_dispatch:
  push:
    branches:
      - claude/suno-local-importer-mvp-7bz1iy
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-macos-arm64.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build & package (macOS arm64)
    # macos-14 is a GitHub-hosted Apple Silicon (arm64) runner.
    runs-on: macos-14

    env:
      # This is an UNSIGNED test build: disable signing discovery so the build
      # does not fail looking for an Apple Developer identity.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Confirm runner is Apple Silicon
        run: |
          echo "runner arch: $(uname -m)"
          test "$(uname -m)" = "arm64" || (echo "Runner is not arm64" && exit 1)

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build macOS arm64 (electron-builder)
        run: npx electron-builder --mac --arm64 --publish never

      - name: List build output
        run: ls -laR dist | sed -n '1,80p'

      - name: Verify artifact existence
        id: verify
        run: |
          set -e
          shopt -s nullglob
          artifacts=(dist/*.dmg dist/*.zip)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No .dmg/.zip artifact produced" && exit 1
          fi
          for a in "${artifacts[@]}"; do
            sz=$(stat -f%z "$a")
            echo "artifact: $a size=$sz"
            test "$sz" -gt 0 || (echo "artifact is empty" && exit 1)
          done

      - name: Validate architecture (app, ffmpeg, ffprobe must be REAL arm64)
        run: |
          set -e
          # Assert a binary's ACTUAL Mach-O architecture — never the path text.
          # `file -b` prints only the type description (no filename/path), so a
          # directory literally named ".../darwin/arm64/..." can never produce a
          # false positive. A binary is accepted iff its description contains
          # "arm64" AND does NOT contain "x86_64" (thin arm64, not x86_64 or a
          # fat binary that still carries an x86_64 slice).
          assert_arm64() {
            label="$1"; bin="$2"
            test -n "$bin" || { echo "FAIL: $label binary not found"; exit 1; }
            test -f "$bin" || { echo "FAIL: $label not a file: $bin"; exit 1; }
            desc="$(file -b "$bin")"
            echo "--- $label ---"
            echo "path: $bin"
            echo "arch: $desc"
            case "$desc" in
              *x86_64*) echo "FAIL: $label contains an x86_64 slice"; exit 1 ;;
            esac
            case "$desc" in
              *arm64*) : ;;
              *) echo "FAIL: $label is not arm64"; exit 1 ;;
            esac
          }

          # Prefer the arm64 output directory; fall back to a bundle whose
          # executable is genuinely arm64 (checked via file -b, not the path).
          APP=$(find dist/mac-arm64 -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            for candidate in $(find dist -maxdepth 2 -name "*.app" -type d); do
              exe="$candidate/Contents/MacOS/Ver Booster"
              d="$(file -b "$exe" 2>/dev/null || true)"
              case "$d" in *x86_64*) continue ;; esac
              case "$d" in *arm64*) APP="$candidate"; break ;; esac
            done
          fi
          echo "app bundle: $APP"
          test -n "$APP" || { echo "FAIL: no arm64 .app bundle found"; exit 1; }

          assert_arm64 "app executable" "$APP/Contents/MacOS/Ver Booster"
          assert_arm64 "ffmpeg" "$(find "$APP/Contents" -name ffmpeg -type f | head -1)"
          assert_arm64 "ffprobe" "$(find "$APP/Contents" -name ffprobe -type f | head -1)"

          # Guard: no stray x86_64 ffprobe must ship in the bundle.
          if find "$APP/Contents" -name ffprobe -type f | while read -r f; do
               file -b "$f" | grep -q x86_64 && echo "$f"; done | grep -q .; then
            echo "FAIL: an x86_64 ffprobe is present in the bundle"; exit 1
          fi

          echo "Architecture validation: PASS (all three binaries are real arm64)"

      - name: Native execution without Rosetta (arm64)
        run: |
          set -e
          APP=$(find dist/mac-arm64 -maxdepth 1 -name "*.app" -type d 2>/dev/null | head -1)
          test -n "$APP" || { echo "FAIL: arm64 bundle missing"; exit 1; }
          FFMPEG=$(find "$APP/Contents" -name ffmpeg -type f | head -1)
          FFPROBE=$(find "$APP/Contents" -name ffprobe -type f | head -1)
          # `arch -arm64` forces native arm64 execution; an x86_64-only binary
          # cannot satisfy it, so a successful -version run is native-arm64 proof
          # that does NOT depend on Rosetta 2.
          echo "--- ffmpeg (arch -arm64) ---"
          arch -arm64 "$FFMPEG" -version | head -1
          echo "--- ffprobe (arch -arm64) ---"
          arch -arm64 "$FFPROBE" -version | head -1
          echo "Native arm64 execution: PASS"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ver-booster-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
