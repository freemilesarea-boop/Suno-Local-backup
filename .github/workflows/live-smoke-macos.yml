name: Live Suno Smoke (macOS)

# Manual-only integration smoke: runs the real end-to-end import against a
# public Suno URL you provide, on an internet-connected macOS runner (this
# repo's sandbox cannot reach suno.com). Nothing is hardcoded and no audio is
# uploaded.
on:
  workflow_dispatch:
    inputs:
      share_url:
        description: 'A public Suno song URL (https://suno.com/song/<uuid>) or /s/ share URL you can access'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run live smoke (real Suno request)
        env:
          SHARE_URL: ${{ github.event.inputs.share_url }}
        run: node scripts/live-smoke.js "$SHARE_URL" mp3+wav
