<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Strict CSP: no remote code, no inline handlers, self only. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suno Local Backup</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Suno Local Backup</h1>
      <p class="subtitle">
        Back up Suno songs you have access to — download, convert, and organize
        them locally.
      </p>
    </header>

    <main>
      <section class="panel">
        <label class="field-label" for="urls">Suno song URLs</label>
        <p class="hint">One per line. Duplicates and blank lines are removed automatically.</p>
        <textarea
          id="urls"
          rows="6"
          placeholder="https://suno.com/song/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
        ></textarea>
        <div id="url-summary" class="url-summary" aria-live="polite"></div>
      </section>

      <section class="panel row">
        <div class="col">
          <span class="field-label">Output format</span>
          <div class="format-options" id="format-options">
            <label><input type="radio" name="format" value="original" checked /> Original</label>
            <label><input type="radio" name="format" value="mp3" /> MP3</label>
            <label><input type="radio" name="format" value="wav" /> WAV</label>
            <label><input type="radio" name="format" value="mp3+wav" /> MP3 + WAV</label>
          </div>
        </div>
        <div class="col">
          <span class="field-label">Destination folder</span>
          <div class="dest-row">
            <button id="choose-folder" class="btn secondary" type="button">Choose folder…</button>
            <span id="dest-path" class="dest-path" title="">No folder selected</span>
          </div>
        </div>
      </section>

      <section class="panel controls">
        <button id="start" class="btn primary" type="button" disabled>Start import</button>
        <button id="retry" class="btn secondary" type="button" disabled>Retry failed</button>
        <span id="global-status" class="global-status"></span>
      </section>

      <section class="panel">
        <h2>Queue</h2>
        <ul id="queue" class="queue"></ul>
        <p id="queue-empty" class="empty">Nothing queued yet.</p>
      </section>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
