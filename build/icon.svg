<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6557E8"/>
      <stop offset="1" stop-color="#5B8DEF"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3F4FA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#151A2D" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Rounded app-icon base (transparent corners) -->
  <rect x="128" y="120" width="768" height="768" rx="180" fill="url(#base)" stroke="#E7E9F0" stroke-width="3" filter="url(#shadow)"/>

  <!-- Music note -->
  <circle cx="404" cy="638" r="86" fill="url(#accent)"/>
  <rect x="474" y="330" width="56" height="316" rx="28" fill="url(#accent)"/>
  <path d="M530 330c74 14 118 46 126 108-33-34-73-46-126-44z" fill="url(#accent)"/>

  <!-- Download arrow (local save) -->
  <rect x="628" y="360" width="46" height="196" rx="23" fill="url(#accent)"/>
  <path d="M604 540 L651 604 L698 540 Z" fill="url(#accent)"/>

  <!-- Storage tray baseline -->
  <rect x="360" y="726" width="304" height="34" rx="17" fill="#D9DCEB"/>
</svg>
